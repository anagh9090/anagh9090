<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" width="800" height="348" role="img" aria-labelledby="an-beyond-t"><title id="an-beyond-t">Beyond the code: Redstone specialist: I spend a lot of time building complex technical contraptions and machinery in Minecraft. GUI? No thanks: I prefer a minimalist, terminal-centric workflow. If it can be done in a TTY, that’s where I’ll be. Fitness: When I’m not coding, I’m working on my strength training routine at my home gym. Vibe: Usually coding to Phonk, Brazilian Funk, or Ultrafunk.</title><defs><linearGradient id="an-beyond-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08131D"/><stop offset="1" stop-color="#0B2536"/></linearGradient><linearGradient id="an-beyond-ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E4C6B"/><stop offset="0.5" stop-color="#00D4E6"/><stop offset="1" stop-color="#A8F3FB"/></linearGradient></defs><rect width="800" height="348" rx="14" fill="url(#an-beyond-bg)"/><rect x="0.5" y="0.5" width="799" height="347" rx="14" fill="none" stroke="#00D4E6" stroke-opacity="0.2"/><path d="M14 0H786A14 14 0 0 1 800 14V334A14 14 0 0 1 786 348H14A14 14 0 0 1 0 334V14A14 14 0 0 1 14 0Z" pathLength="100" fill="none" stroke="url(#an-beyond-ln)" stroke-width="2" stroke-linecap="round" stroke-dasharray="9 91"><animate attributeName="stroke-dashoffset" values="9;-91" dur="11s" begin="0s" repeatCount="indefinite"/></path><circle cx="38" cy="40" r="4" fill="#00D4E6"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.03" dur="13.60s" repeatCount="indefinite"/></circle><text x="56" y="46" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#E8FCFF" text-anchor="start"><tspan fill="#00D4E6" font-weight="700">Redstone specialist:</tspan> I spend a lot of time building<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.03" dur="13.60s" repeatCoun